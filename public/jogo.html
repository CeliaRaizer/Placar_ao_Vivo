<link rel="stylesheet" href="assets/css/jogo.css">

<header>
    <div class="container">
        <h1>Placar ao Vivo</h1>
        <p>Acompanhe o jogo em tempo real</p>
    </div>
</header>

<nav>
    <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="jogo.html">Placar</a></li>
        <li><a href="historico.html">Histórico</a></li>
        <li><a href="admin.html">Admin</a></li>
        <li><a href="classificacao.html">Classificação</a></li>
    </ul>
</nav>

<div class="container">

    <section class="placar-section">
        <h1 id="placar"></h1>
        <h2 id="tempo"></h2>
    </section>

    <section>
        <h3>Minuto a minuto</h3>
        <ul id="eventos"></ul>
    </section>

    <section class="conexao">
        <p id="status">🔴 Desconectado</p>
        <button id="btnConectar">🔌 Conectar</button> <button id="btnDesconectar">❌ Desconectar</button>
        <p id="usuarios">👥 Usuários conectados: 0</p>
    </section>

</div>

<footer>
    <p>Sistema de Placar em Tempo Real</p>
</footer>

<script>

let ws = null

const placar = document.getElementById("placar")
const tempo = document.getElementById("tempo")
const lista = document.getElementById("eventos")
const status = document.getElementById("status")

document.getElementById("btnConectar").addEventListener("click", conectar)
document.getElementById("btnDesconectar").addEventListener("click", desconectar)

function conectar(){

    if(ws && ws.readyState === WebSocket.OPEN){
        status.innerText = "🟢 Já conectado"
        return
    }

    status.innerText = "🟡 Conectando..."

    ws = new WebSocket("ws://localhost:3000")

    ws.onopen = () => {
        status.innerText = "🟢 Conectado ao servidor"
    }

    ws.onerror = () => {
        status.innerText = "❌ Erro na conexão"
    }

    ws.onclose = () => {
        status.innerText = "🔴 Conexão encerrada"
    }

    ws.onmessage = (event) => {

        const dados = JSON.parse(event.data)

        // usuários conectados
        if(dados.tipo === "usuarios"){
            document.getElementById("usuarios").innerText =
                "👥 Usuários conectados: " + dados.total
            return
        }

        let jogo = null

        if(dados.tipo === "jogo-atualizado"){
            jogo = dados.jogo
        } 
        else if(!dados.tipo){
            jogo = dados
        } 
        else{
            return
        }

        // nenhum jogo ativo
        if(!jogo || !jogo.timeA){
            placar.innerText = "Nenhum jogo em andamento"
            tempo.innerText = ""
            lista.innerHTML = ""
            return
        }

        // atualizar placar
        placar.innerText =
            `${jogo.timeA} ${jogo.golsA} x ${jogo.golsB} ${jogo.timeB}`

        // atualizar tempo
        tempo.innerText = `⏱ ${jogo.minuto}'`

        // atualizar eventos
        lista.innerHTML = ""

        const eventos = jogo.eventos || []

        eventos.slice().reverse().forEach(function(e){

            const li = document.createElement("li")
            li.innerText = e
            lista.appendChild(li)

        })

    }

}

function desconectar(){
    if(ws){
        ws.close()
    }
}

// conecta automaticamente ao abrir a página
conectar()

</script>
