<h1 id="placar"></h1>

<ul id="eventos"></ul>

<script>

const ws = new WebSocket("ws://localhost:3000");

ws.onmessage = (event) => {

    const jogo = JSON.parse(event.data);

    document.getElementById("placar").innerText =
        jogo.timeA + " " + jogo.golsA + " x " + jogo.golsB + " " + jogo.timeB;

    const lista = document.getElementById("eventos");
    lista.innerHTML = "";

    jogo.eventos.forEach(e => {

        const li = document.createElement("li");
        li.innerText = e;
        lista.appendChild(li);

    });

};

</script>
