<link rel="stylesheet" href="assets/css/historico.css">

<header>
    <div class="container">
        <h1>Histórico de Jogos</h1>
        <p>Partidas já finalizadas</p>
    </div>
</header>

<nav>
    <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="jogo.html">Placar</a></li>
        <li><a href="historico.html">Histórico</a></li>
        <li><a href="admin.html">Admin</a></li>
        <li><a href="classificacao.html">Classificação</a></li>
    </ul>
</nav>

<div class="container">

    <h2>Jogos Anteriores</h2>

    <p id="status">🔴 Desconectado</p>

    <div class="conexao">
        <button onclick="conectar()">🔌 Conectar</button>
        <button onclick="desconectar()">❌ Desconectar</button>
    </div>

    <ul id="lista"></ul>

</div>

<footer>
    <p>Sistema de Placar em Tempo Real</p>
</footer>

<script>

let ws = null

function conectar(){

    if(ws && ws.readyState === WebSocket.OPEN){
        return
    }

    ws = new WebSocket("ws://localhost:3000")

    document.getElementById("status").innerText = "🟡 Conectando..."

    ws.onopen = () => {
        document.getElementById("status").innerText = "🟢 Conectado"
    }

    ws.onclose = () => {
        document.getElementById("status").innerText = "🔴 Desconectado"
    }

    ws.onerror = () => {
        document.getElementById("status").innerText = "❌ Erro de conexão"
    }

    ws.onmessage = (event) => {

        const dados = JSON.parse(event.data)

        if(dados.tipo === "historico-atualizado"){
            mostrarHistorico(dados.historico || [])
        }

    }

}

function desconectar(){
    if(ws){
        ws.close()
    }
}

function mostrarHistorico(jogos){

    const lista = document.getElementById("lista")
    lista.innerHTML = ""

    if(!jogos || jogos.length === 0){
        lista.innerHTML = "<li>Nenhum jogo no histórico</li>"
        return
    }

    jogos.forEach((jogo,index)=>{

        const li = document.createElement("li")

        li.innerHTML = `
            <div class="card-jogo">

                <div class="jogo-info">
                    <span class="placar">
                        ${jogo.timeA} ${jogo.golsA} x ${jogo.golsB} ${jogo.timeB}
                    </span>

                    <span class="data">
                        📅 ${jogo.data || ""}
                    </span>
                </div>

                <div class="botoes">
                    <button class="btn-detalhes" onclick="verDetalhes(${index})">
                        👁 Detalhes
                    </button>

                    <button class="btn-excluir" onclick="excluirJogo(${index})">
                        🗑 Excluir
                    </button>
                </div>

            </div>

            <div id="detalhes-${index}" class="detalhes-jogo"></div>
        `

        lista.appendChild(li)

    })

}

function verDetalhes(index){

    const area = document.getElementById(`detalhes-${index}`)

    if(area.innerHTML !== ""){
        area.innerHTML = ""
        return
    }

    fetch("/historico")
    .then(res => res.json())
    .then(jogos => {

        const jogo = jogos[index]

        const eventosLista = jogo.eventos || []

        let eventos = ""

        if(eventosLista.length === 0){
            eventos = "<p>Nenhum evento registrado</p>"
        }else{
            eventos = "<ul>" + eventosLista.map(e => `<li>${e}</li>`).join("") + "</ul>"
        }

        area.innerHTML = `
        <div class="detalhes-card">

            <h3>Eventos do jogo</h3>

            ${eventos}

        </div>
        `
    })

}

function excluirJogo(index){

    if(!confirm("Deseja excluir este jogo?")){
        return
    }

    fetch("/historico/remover",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({ index })
    })

}

// conecta automaticamente ao abrir a página
conectar()

</script>
