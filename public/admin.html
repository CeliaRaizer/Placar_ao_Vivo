<link rel="stylesheet" href="assets/css/admin.css">

<header>
    <div class="container">
        <h1>Painel do Administrador</h1>
        <p>Controle dos jogos em tempo real</p>
    </div>
</header>

<nav>
    <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="jogo.html">Placar</a></li>
        <li><a href="historico.html">Histórico</a></li>
        <li><a href="admin.html">Admin</a></li>
        <li><a href="classificacao.html">Classificação</a></li>
    </ul>
</nav>

<div class="container">

    <section>

        <h2>Criar Jogo</h2>

        <input id="timeA" placeholder="Nome do Time A">
        <input id="timeB" placeholder="Nome do Time B">

        <button class="btn btn-primary" onclick="criarJogo()">Criar Jogo</button>

    </section>


    <section>

        <h2>Registrar Gol</h2>

        <input id="jogador" placeholder="Nome do jogador">
        <input id="minuto" placeholder="Minuto do jogo">

        <div class="action-buttons">
            <button class="btn btn-success" onclick="golA()">⚽ Gol Time A</button>
            <button class="btn btn-success" onclick="golB()">⚽ Gol Time B</button>
        </div>

    </section>


    <section>

        <h2>Registrar Cartão</h2>

        <input id="jogadorCartao" placeholder="Nome do jogador">
        <input id="minutoCartao" placeholder="Minuto do jogo">

        <select id="tipoCartao">
            <option value="amarelo">🟨 Cartão Amarelo</option>
            <option value="vermelho">🟥 Cartão Vermelho</option>
        </select>

        <div class="action-buttons">
            <button class="btn btn-primary" onclick="cartaoA()">Cartão Time A</button>
            <button class="btn btn-primary" onclick="cartaoB()">Cartão Time B</button>
        </div>

    </section>


    <section>
        <h2>Remover Jogo</h2>
        <button class="btn btn-danger" onclick="removerJogo()">Finalizar Jogo</button>
    </section>

</div>

<footer>
    <p>Sistema de Placar em Tempo Real</p>
</footer>

<script>

function criarJogo(){

    const timeA = document.getElementById("timeA").value.trim()
    const timeB = document.getElementById("timeB").value.trim()

    if(!timeA || !timeB){
        alert("Informe os dois times!")
        return
    }

    fetch("/definir-times",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({timeA,timeB})
    })
    .then(()=>{

        alert("Jogo criado!")

        document.getElementById("timeA").value = ""
        document.getElementById("timeB").value = ""

    })
    .catch(()=>alert("Erro ao criar jogo"))

}

function golA(){

    const jogador = document.getElementById("jogador").value.trim()
    const minuto = document.getElementById("minuto").value.trim()

    if(!jogador || !minuto){
        alert("Informe jogador e minuto")
        return
    }

    fetch("/golA",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({jogador,minuto})
    })

    document.getElementById("jogador").value = ""
    document.getElementById("minuto").value = ""

}

function golB(){

    const jogador = document.getElementById("jogador").value.trim()
    const minuto = document.getElementById("minuto").value.trim()

    if(!jogador || !minuto){
        alert("Informe jogador e minuto")
        return
    }

    fetch("/golB",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({jogador,minuto})
    })

    document.getElementById("jogador").value = ""
    document.getElementById("minuto").value = ""

}

function cartaoA(){

    const jogador = document.getElementById("jogadorCartao").value.trim()
    const minuto = document.getElementById("minutoCartao").value.trim()
    const tipo = document.getElementById("tipoCartao").value

    if(!jogador || !minuto){
        alert("Informe jogador e minuto")
        return
    }

    fetch("/cartao",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({jogador,minuto,tipo,time:"A"})
    })

    document.getElementById("jogadorCartao").value = ""
    document.getElementById("minutoCartao").value = ""

}

function cartaoB(){

    const jogador = document.getElementById("jogadorCartao").value.trim()
    const minuto = document.getElementById("minutoCartao").value.trim()
    const tipo = document.getElementById("tipoCartao").value

    if(!jogador || !minuto){
        alert("Informe jogador e minuto")
        return
    }

    fetch("/cartao",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({jogador,minuto,tipo,time:"B"})
    })

    document.getElementById("jogadorCartao").value = ""
    document.getElementById("minutoCartao").value = ""

}

function removerJogo(){

    if(!confirm("Deseja finalizar o jogo?")){
        return
    }

    fetch("/remover-jogo",{
        method:"POST"
    })
    .then(()=>{

        alert("Jogo finalizado!")

        document.getElementById("timeA").value = ""
        document.getElementById("timeB").value = ""

    })
    .catch(()=>alert("Erro ao finalizar jogo"))

}

</script>
